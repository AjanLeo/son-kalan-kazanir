name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Configure Godot Android settings and debug keystore
        run: |
          mkdir -p ~/.config/godot ~/.android
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV
      - name: Import project and validate game startup
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --editor --path . --quit 2>&1 | tee build/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" build/import.log; then
            echo "Godot script validation failed during import."
            exit 1
          fi
          godot --headless --path . --quit-after 5 2>&1 | tee build/startup.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" build/startup.log; then
            echo "Game startup smoke test failed."
            exit 1
          fi
      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug Android build/SON_KALAN_KAZANIR.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SON-KALAN-KAZANIR-APK
          path: build/SON_KALAN_KAZANIR.apk
          if-no-files-found: error
